<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#2F4FD1"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FA"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="1" stop-color="#1B2547"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1A4A" flood-opacity="0.35"/>
    </filter>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0B1A4A" flood-opacity="0.25"/>
    </filter>
    <clipPath id="squircle">
      <path d="M 300 92 L 724 92 C 860 92 932 164 932 300 L 932 724 C 932 860 860 932 724 932 L 300 932 C 164 932 92 860 92 724 L 92 300 C 92 164 164 92 300 92 Z"/>
    </clipPath>
  </defs>

  <!-- macOS squircle background -->
  <g clip-path="url(#squircle)">
    <rect x="92" y="92" width="840" height="840" fill="url(#bg)"/>
    <circle cx="300" cy="260" r="360" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="780" cy="820" r="300" fill="#000000" opacity="0.08"/>
  </g>

  <!-- Clipboard body -->
  <g filter="url(#shadow)">
    <rect x="292" y="268" width="440" height="520" rx="48" fill="url(#board)"/>
  </g>

  <!-- History lines: newest highlighted -->
  <rect x="352" y="400" width="320" height="40" rx="20" fill="#5B8DEF"/>
  <rect x="352" y="476" width="260" height="40" rx="20" fill="#C9D4EE"/>
  <rect x="352" y="552" width="300" height="40" rx="20" fill="#C9D4EE"/>
  <rect x="352" y="628" width="200" height="40" rx="20" fill="#C9D4EE"/>

  <!-- Clip on top -->
  <g filter="url(#softshadow)">
    <rect x="412" y="212" width="200" height="112" rx="40" fill="url(#clip)"/>
    <rect x="452" y="188" width="120" height="64" rx="32" fill="none" stroke="url(#clip)" stroke-width="30"/>
  </g>
  <!-- Lock badge: the history is under a password. White disc over the board's corner, the lock in the clip's colour -->
  <g filter="url(#shadow)"><circle cx="772" cy="792" r="124" fill="#FFFFFF"/></g>
  <circle cx="772" cy="792" r="124" fill="url(#board)"/>
  <g transform="translate(772,796) scale(1.45) translate(-50,-62)">
    <path d="M 30 48 V 34 a 20 20 0 0 1 40 0 V 48" fill="none" stroke="url(#clip)" stroke-width="11" stroke-linecap="round"/>
    <rect x="14" y="46" width="72" height="54" rx="12" fill="url(#clip)"/>
    <circle cx="50" cy="68" r="7" fill="#FFFFFF"/><rect x="46.5" y="68" width="7" height="16" rx="3.5" fill="#FFFFFF"/>
  </g>
</svg>
