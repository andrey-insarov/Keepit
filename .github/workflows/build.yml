name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; the release job raises it explicitly.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (Dependabot keeps them fresh)
# so a moved tag can't inject code into a job that holds signing secrets.

jobs:
  # Every push and PR: build, test, ad-hoc package, UI smoke test. No secrets.
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0            # BUILD_NO = commit count

      - name: Swift version
        run: swift --version

      - name: Build (debug, warnings visible)
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Package app + DMG (ad-hoc)
        run: make dist VERSION=$(cat VERSION)

      - name: UI smoke test (launches the app, snapshots windows)
        env:
          KEEPIT_DATA_DIR: ${{ runner.temp }}/keepit-selftest
        run: |
          perl -e 'alarm 120; exec @ARGV' ./Keepit.app/Contents/MacOS/Keepit --selftest
          cat selftest-output/report.txt

      - name: Upload self-test snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest-${{ github.sha }}
          path: selftest-output/

      - name: Upload ad-hoc build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Keepit-adhoc-${{ github.sha }}
          path: |
            Keepit-*.zip
            Keepit-*.dmg

  # Tags only: signed, notarized, stapled build + Sparkle appcast + GitHub release.
  # Secrets live in the "release" environment, which only v* tags may deploy to
  # (and, if configured, only after manual approval), so no other run can read them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    environment: release
    permissions:
      contents: write           # upload release assets, push the cask bump to main
    env:
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm $RUNNER_TEMP/cert.p12
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "SIGN_ID=$IDENTITY" >> $GITHUB_ENV
          echo "Using identity: $IDENTITY"

      - name: Package, notarize and staple (Developer ID)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          MACOS_DEVID_PROFILE: ${{ secrets.MACOS_DEVID_PROFILE }}
        run: |
          # The Developer ID provisioning profile is what gives the app access to the
          # data-protection keychain; without it Touch ID unlock silently stops working.
          if [ -z "$MACOS_DEVID_PROFILE" ]; then echo "::error::MACOS_DEVID_PROFILE secret is missing — refusing to ship a build without Touch ID (see RELEASING.md, section C)"; exit 1; fi
          echo "$MACOS_DEVID_PROFILE" | base64 --decode > Resources/KeepitDevID.provisionprofile
          security cms -D -i Resources/KeepitDevID.provisionprofile | plutil -extract Name raw - || { echo "::error::MACOS_DEVID_PROFILE is not a valid provisioning profile"; exit 1; }
          echo "$APPSTORE_PRIVATE_KEY" > $RUNNER_TEMP/AuthKey.p8
          make notarize VERSION=$(cat VERSION) SIGN_ID="$SIGN_ID" APPSTORE_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          rm $RUNNER_TEMP/AuthKey.p8
          # Zip the stapled app without rebuilding (make dist would re-sign and drop the ticket).
          ditto -c -k --keepParent Keepit.app Keepit-$(cat VERSION).zip

      - name: Sparkle appcast (EdDSA-signed)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > $RUNNER_TEMP/sparkle_ed25519
          make appcast VERSION=$(cat VERSION) SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle_ed25519
          rm $RUNNER_TEMP/sparkle_ed25519
          cat appcast.xml

      - name: Delete signing keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db || true

      - name: Upload release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Keepit-${{ github.sha }}
          path: |
            Keepit-*.zip
            Keepit-*.dmg
            appcast.xml

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            Keepit-*.dmg
            Keepit-*.dmg.sig
            Keepit-*.zip
            SHA256SUMS
            appcast.xml
          generate_release_notes: true

      - name: Update Homebrew cask (version + sha256) on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          make cask VERSION=$(cat VERSION)
          git add Casks/keepit.rb
          git diff --cached --quiet || git commit -m "cask: Keepit $(cat VERSION)"
          git push origin main
