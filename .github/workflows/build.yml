name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # BUILD_NO = commit count

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true

      - name: Swift version
        run: swift --version

      - name: Build (debug, warnings visible)
        run: swift build

      - name: Package app
        run: make dist VERSION=$(cat VERSION)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keepit-${{ github.sha }}
          path: Keepit-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Keepit-*.zip
          generate_release_notes: true
